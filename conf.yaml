# /etc sync targets. hosts keys become infra/<host>/etc paths.
hosts:
  s1: isucon-s1
  s2: isucon-s2
  s3: isucon-s3
  s4: isucon-s4

# Common paths for all hosts. Files and directories are both supported.
includes:
  - /etc/sysctl.conf
  - /etc/sysctl.d
  - /etc/security/limits.conf
  - /etc/hosts
  # nginx (sites-enabled は symlink。実体は sites-available)
  - /etc/nginx/nginx.conf
  - /etc/nginx/sites-enabled
  - /etc/nginx/sites-available
  - /etc/nginx/conf.d
  # PostgreSQL 16
  - /etc/postgresql/16/main

excludes:
  - "*.bak"
  - "*.sock"

# アプリサーバだけ。drop-in で標準出力を捨てる。
host_includes:
  s1:
    - /etc/systemd/system/isureal-go.service.d
  s2:
    - /etc/systemd/system/isureal-go.service.d
  s3:
    - /etc/systemd/system/isureal-go.service.d

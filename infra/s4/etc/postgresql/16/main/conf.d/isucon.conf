listen_addresses = '*'

shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
wal_buffers = 16MB

random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

jit = off
max_parallel_workers_per_gather = 0

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

max_connections = 300

# Sync both regional standbys before commit returns (write-then-read visibility).
# Rollback: set synchronous_standby_names = '' and reload.
synchronous_standby_names = 'ANY 2 (europe1, america1)'
synchronous_commit = remote_apply

# 両スタンバイ（europe1 / america1）が pg_stat_replication で streaming
# になってから、このファイルを isucon-sync.conf にリネームして置く。
# 書き込み後の可視性（リージョン跨ぎ）用。片肺だとコミットが止まる。
#
#   sudo cp isucon-sync.conf.example isucon-sync.conf
#   sudo -u postgres psql -c "SELECT pg_reload_conf();"
#
# 切り戻し:
#   sudo rm conf.d/isucon-sync.conf
#   sudo -u postgres psql -c "SELECT pg_reload_conf();"

synchronous_standby_names = 'ANY 2 (europe1, america1)'
# 書き込みはすべて standby の反映を待たずに commit する（約 100ms の WAN 往復を外す）。
# standby から読む europe1 / america1 では、commit 直後の読み取りに結果が見えないことがある。
# トランザクション単位で SET LOCAL synchronous_commit = remote_apply にすれば従来どおり待つ。
synchronous_commit = local

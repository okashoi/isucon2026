# asia の API を s1 と s4（同一リージョン）へ分散する。
# 画像のバイト列は s1 の post-images / image-cache 前提なので、
# 画像の読み書きに関わるパスだけ s1 に固定する。
upstream isureal_app {
  server 127.0.0.1:8080;
  server 192.168.4.10:8080;
  keepalive 32;
}

upstream isureal_images {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location ^~ /api/images/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_images;
  }

  location = /api/me/profile-image {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_images;
  }

  location = /api/posts {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_images;
  }

  location ~ ^/api/posts/[^/]+/realmojis$ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_images;
  }

  location ^~ /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}

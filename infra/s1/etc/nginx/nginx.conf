user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    ##
    # Basic
    ##
    server_tokens off;
    client_body_buffer_size 1m;
    client_max_body_size 10m;
    include mime.types;
    default_type application/octet-stream;
    keepalive_timeout 120;
    keepalive_requests 10000;

    ##
    # Logging
    ##
    log_format kataribe '$remote_addr - $remote_user [$time_local] '
          '"$request" $status $body_bytes_sent '
          '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log kataribe buffer=16k;
    error_log /var/log/nginx/error.log;

    ##
    # SSL
    ##
    ssl_protocols TLSv1.1 TLSv1.2; # Dropping SSLv3, TLS v1.0
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:3m;
    ssl_session_timeout 3m;

    ##
    # Gzip
    # Note: CPU使用率が高いときに有効にするとスコアが下がることに注意
    ##
    gzip on;
    gzip_comp_level 5; # 1-9, 5=balanced
    gzip_min_length 10k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Open file cache
    ##
    open_file_cache max=100000;
    open_file_cache_valid 65s;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/sites-enabled/*;
}
